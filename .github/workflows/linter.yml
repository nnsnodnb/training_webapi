name: Lint

on: [pull_request]

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Run actionlint
      uses: reviewdog/action-actionlint@ab7138020abfe6cd20b742c82e5b7a9749fb5884  # v1.75.0
      with:
        github_token: ${{ secrets.github_token }}
        reporter: github-pr-review
        level: warning

  hadolint:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: run hadolint
      uses: reviewdog/action-hadolint@9d9a44af664599d7fe5ed5ee3d66d2d236cb7f8f  # v1.54.0
      with:
        reporter: github-pr-review
        level: warning
