name: Lint

on: [pull_request]

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Run actionlint
      uses: reviewdog/action-actionlint@v1.80.1
      with:
        github_token: ${{ secrets.github_token }}
        reporter: github-pr-review
        level: warning

  hadolint:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: run hadolint
      uses: reviewdog/action-hadolint@v1.55.0
      with:
        reporter: github-pr-review
        level: warning
