name: Release

on:
  push:
    tags:
    - '*.*.*'

jobs:
  macos_build:
    name: Build Swift for macOS
    runs-on: macos-26

    strategy:
      matrix:
        swift_arch: ['x86_64', 'arm64']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: swift build -c release --arch "${{ matrix.swift_arch }}"
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp ".build/${{ matrix.swift_arch }}-apple-macosx/release/Training" "artifact/Training"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: training-${{ runner.os }}-${{ matrix.swift_arch }}
          path: artifact/Training

  static_build:
    strategy:
      matrix:
        include:
          - arch: amd64
            swift_arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            swift_arch: aarch64
            runner: ubuntu-24.04-arm

    name: Build Swift Linux Static binary for ${{ matrix.arch }}
    container: ghcr.io/nnsnodnb/swift-static-linux-sdk:6.3.3-bookworm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: swift build -c release --swift-sdk "${{ matrix.swift_arch }}-swift-linux-musl"
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp ".build/${{ matrix.swift_arch }}-swift-linux-musl/release/Training" "artifact/Training"
          strip --verbose artifact/Training
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: training-${{ runner.os }}-${{ matrix.arch }}
          path: artifact/Training

  release_container:
    name: Build & push container image
    runs-on: ubuntu-24.04-arm
    needs: static_build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download amd64 (x86_64) binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: training-${{ runner.os }}-amd64
          path: artifacts/amd64
      - name: Download arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: training-${{ runner.os }}-arm64
          path: artifacts/arm64
      - name: Setup QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0
      - name: Setup QEMU Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Get the tag name
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "${GITHUB_ENV}"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to Docker Container Registries
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nnsnodnb/training_webapi:${{ env.TAG_NAME }}
            ghcr.io/nnsnodnb/training_webapi:latest

  publish_release:
    name: Publish GitHub release
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos_build
      - static_build

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download artifact for x86_64 macOS binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: training-macOS-x86_64
          path: artifacts/macos/x86_64
      - name: Download artifact for arm64 macOS binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: training-macOS-arm64
          path: artifacts/macos/arm64
      - name: Download artifacts for amd64 Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: training-Linux-amd64
          path: artifacts/linux/amd64
      - name: Download artifacts for arm64 Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: training-Linux-arm64
          path: artifacts/linux/arm64
      - name: Create Universal binary zip for macOS
        run: |
          lipo -create \
            artifacts/macos/x86_64/Training \
            artifacts/macos/arm64/Training \
            -output artifacts/macos/Training
          strip artifacts/macos/Training
          zip -j artifacts/macos/macOS-universal.zip artifacts/macos/Training
          zip -r artifacts/macos/macOS-universal.zip Public
      - name: Zip Linux binaries
        run: |
          zip -j artifacts/linux/amd64/linux-amd64.zip artifacts/linux/amd64/Training
          zip -j artifacts/linux/arm64/linux-arm64.zip artifacts/linux/arm64/Training
      - name: Get the tag name
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "${GITHUB_ENV}"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ env.TAG_NAME }}
          files: |
            artifacts/macos/macOS-universal.zip
            artifacts/linux/amd64/linux-amd64.zip
            artifacts/linux/arm64/linux-arm64.zip
          generate_release_notes: true
          draft: true
