name: Release

on:
  push:
    tags:
    - '*.*.*'

jobs:
  macos_build:
    name: Build Swift for macOS
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: swift build -c release --arch arm64
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp ".build/out/Products/Release/Training" "artifact/Training"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: training-${{ runner.os }}-arm64
          path: artifact/Training

  static_build:
    strategy:
      matrix:
        include:
          - arch: amd64
            swift_arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            swift_arch: aarch64
            runner: ubuntu-24.04-arm

    name: Build Swift Linux Static binary for ${{ matrix.arch }}
    container: ghcr.io/nnsnodnb/swift-static-linux-sdk:6.4.0-trixie
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: swift build -c release --swift-sdk "${{ matrix.swift_arch }}-swift-linux-musl"
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp ".build/out/Products/Release-staticlinux-${{ matrix.swift_arch }}/Training" "artifact/Training"
          strip --verbose artifact/Training
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: training-${{ runner.os }}-${{ matrix.arch }}
          path: artifact/Training

  release_container:
    name: Build & push container image
    runs-on: ubuntu-26.04-arm
    needs: static_build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download amd64 (x86_64) binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: training-${{ runner.os }}-amd64
          path: artifacts/amd64
      - name: Download arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: training-${{ runner.os }}-arm64
          path: artifacts/arm64
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - name: Setup QEMU Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Get the tag name
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "${GITHUB_ENV}"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to Docker Container Registries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nnsnodnb/training_webapi:${{ env.TAG_NAME }}
            ghcr.io/nnsnodnb/training_webapi:latest

  publish_release:
    name: Publish GitHub release
    runs-on: xcode-27
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos_build
      - release_container

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download artifact for arm64 macOS binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: training-macOS-arm64
          path: artifacts
      - name: Create binary zip for macOS
        run: |
          strip artifacts/Training
          zip -j artifacts/macOS-portable.zip artifacts/Training
          zip -r artifacts/macOS-portable.zip Public
      - name: Get the tag name
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "${GITHUB_ENV}"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ env.TAG_NAME }}
          files: |
            artifacts/macOS-portable.zip
          generate_release_notes: true
          draft: true
